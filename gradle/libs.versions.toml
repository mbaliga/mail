[versions]
# AGP LOCKSTEP (D-Q): Hyle and shared-libraries are composited into this build and both pin
# AGP 8.9.1. Gradle hard-fails on mixed AGP versions inside one composite, so this is not ours to
# bump alone. Kotlin follows the same two repos.
agp = "8.9.1"
kotlin = "2.1.0"
coroutines = "1.10.1"
serialization = "1.8.0"
okhttp = "4.12.0"
# androidx.sqlite's KMP driver API, with the bundled SQLite build: the framework SQLite on Android
# is compiled without FTS5, and FTS5 is what search-core's QueryCompiler.compileFts targets.
sqlite = "2.5.2"
coreKtx = "1.15.0"
activityCompose = "1.10.0"
lifecycle = "2.8.7"
composeBom = "2025.05.01"
work = "2.10.1"
browser = "1.8.0"
appauth = "0.11.1"
playServicesAuth = "21.3.0"
# ML Kit GenAI — Gemini Nano through AICore. Beta APIs; every call is availability-gated and every
# feature has a heuristic or BYOK fallback, so a device without AICore loses nothing but speed.
mlkitGenaiPrompt = "1.0.0-beta2"
mlkitGenaiSummarization = "1.0.0-beta1"
mlkitGenaiProofreading = "1.0.0-beta1"
mlkitGenaiRewriting = "1.0.0-beta1"
mlkitLanguageId = "17.0.6"
mlkitTranslate = "17.0.3"
mlkitEntityExtraction = "16.0.0-beta6"
# LiteRT-LM is not used: every release is built with Kotlin 2.3+ metadata and Java 21 bytecode, which this
# build's Kotlin 2.1 (pinned by the constellation) cannot read. MediaPipe's LLM Inference API (Java 8,
# no Kotlin metadata) runs the same local Gemma model files instead.
# The official Anthropic SDK (Kotlin uses the Java SDK). 3.4.0: Java 8 bytecode, Kotlin metadata 2.0
# (readable by this build's Kotlin 2.1), kotlin-stdlib 1.9, OkHttp 4.12 — the same OkHttp we use.
anthropic = "3.4.0"
mediapipeGenai = "0.10.35"
coroutinesGuava = "1.10.1"
junit = "4.13.2"
# Play Feature Delivery: installs the on-device runtime module on demand (Play installs only).
playFeatureDelivery = "2.1.0"
# JVM rendering of the app's screens (Robolectric native graphics + Roborazzi), so layouts are
# checked against the reference design without an emulator.
robolectric = "4.14.1"
roborazzi = "1.43.0"
androidxTestCore = "1.6.1"

