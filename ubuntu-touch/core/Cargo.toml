[package]
name = "mailcore"
version = "0.1.0"
edition = "2021"
description = "Portable mail core for the Ubuntu Touch port of You've got Mail (Rust port of the pure-logic slice of :mail-core)"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
encoding_rs = "0.8"
fancy-regex = "0.14"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = "s"
lto = true
# no panic = "abort": ffi.rs relies on catch_unwind to turn a panic into an error JSON instead of killing the app
strip = true

[dev-dependencies]
serde_json = "1"
