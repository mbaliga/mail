name: iOS

# The iOS port ("You've got Mail" for iPhone/iPad) builds ONLY here - there is no Mac in the
# development container. EVIDENCE CLASS: CI-LANE-WRITTEN until a run is seen.
#
#   swift-core-linux  Swift 6.0 on Linux: the portable MailKit core (everything but Net/) + its tests.
#   ios-macos         macos-latest: MailKit tests (this also compiles the Network.framework layer),
#                     XcodeGen -> xcodebuild for the iOS Simulator (unsigned), app unit tests, and an
#                     unsigned .app zip kept only on tags.
#   ios-release       Tags only, behind the `ios-release` environment (approval + secrets live there):
#                     signed archive + .ipa. Nothing signing-related is in the repo.
#
# Private repo: macOS minutes are billed at a multiple of Linux minutes. The macOS jobs therefore
# only run for ios/ changes, tags and manual dispatch.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    tags: ["ios-v*"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.42.0"
  # sha256 of xcodegen.zip for the version above (computed from the release download; re-check on bump).
  XCODEGEN_SHA256: a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82

jobs:
  swift-core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: MailKit tests (Linux, Foundation only)
        working-directory: ios
        run: swift test

  ios-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          # Prefer the newest installed Xcode 16.x; fall back to whatever the image selected.
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      - name: MailKit tests (macOS; compiles the Network.framework layer too)
        working-directory: ios
        run: swift test

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build + test for the iOS Simulator (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' in rt:
                  for dev in d[rt]:
                      if dev['name'].startswith('iPhone') and dev['isAvailable']:
                          print(dev['udid']); raise SystemExit
          ")
          test -n "$DEST"
          xcodebuild test \
            -project YouveGotMail.xcodeproj -scheme YouveGotMail \
            -destination "id=$DEST" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Zip the unsigned simulator .app
        if: startsWith(github.ref, 'refs/tags/ios-v')
        working-directory: ios
        run: |
          APP=$(find build/DerivedData/Build/Products -name 'YouveGotMail.app' -maxdepth 3 | head -1)
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/YouveGotMail-simulator-unsigned.zip"

      - name: Upload (tags only; the zip is convenience, not the gate)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YouveGotMail-simulator-unsigned
          path: ${{ runner.temp }}/YouveGotMail-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  ios-release:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: [swift-core-linux, ios-macos]
    runs-on: macos-latest
    timeout-minutes: 45
    # Approval gate + secrets live on this GitHub environment, never in the repo:
    #   IOS_CERT_P12_BASE64   Apple Distribution certificate (.p12), base64
    #   IOS_CERT_PASSWORD     its password
    #   IOS_PROFILE_BASE64    App Store provisioning profile for com.asoc.youvegotmail, base64
    #   IOS_PROFILE_NAME      the profile's name
    #   IOS_TEAM_ID           Apple Developer team id
    environment: ios-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Import signing material into a throwaway keychain
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild archive \
            -project YouveGotMail.xcodeproj -scheme YouveGotMail \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YouveGotMail.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.asoc.youvegotmail</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/YouveGotMail.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - name: Upload the signed .ipa (tag build; upload to TestFlight is the owner's step)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YouveGotMail-ios-signed
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove the keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"
